spring.datasource.url=jdbc:h2:mem:rag_agent;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.sql.init.mode=always
security.password.bcrypt-strength=4
security.auth.jwt.secret=test-only-jwt-secret-not-for-production-use-32b
security.auth.jwt.issuer=rag-agent-test
security.auth.jwt.access-token-ttl-seconds=1800
security.auth.cookie.name=access_token
security.auth.cookie.secure=false
security.auth.cookie.same-site=Lax
security.auth.cookie.path=/
