spring.datasource.url=jdbc:h2:mem:rag_agent;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.sql.init.mode=always
security.password.bcrypt-strength=4
security.auth.jwt.secret=test-only-jwt-secret-not-for-production-use-32b
security.auth.jwt.issuer=rag-agent-test
security.auth.jwt.access-token-ttl-seconds=900
security.auth.jwt.refresh-token-ttl-seconds=604800
security.auth.cookie.name=access_token
security.auth.cookie.refresh-name=refresh_token
security.auth.cookie.secure=false
security.auth.cookie.same-site=Lax
security.auth.cookie.path=/
app.rate-limit.register-per-ip-per-minute=1000
app.rate-limit.login-per-ip-per-minute=1000
app.rate-limit.login-per-account-per-minute=1000
app.rate-limit.send-per-user-per-minute=1000
app.auth.lock-threshold=100
app.auth.lock-duration-minutes=15
# 测试环境不启动 Redis 自动配置：限流器与 jti 黑名单确定性地使用内存实现，
# 既避免每个请求尝试连接本机 Redis（连接拒绝噪声），也让黑名单断言可预测。
# Spring Boot 4.1 把 Redis 自动配置拆到独立模块并改名为 DataRedis*AutoConfiguration
# （旧名 ...data.redis.RedisAutoConfiguration 已不存在，排除旧名不会生效）。
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
