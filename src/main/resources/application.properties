spring.application.name=rag_agent
# 本机密码等私有配置放在被 Git 忽略的 .local/application.properties 中。
spring.config.import=optional:file:./.local/application.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rag_agent}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
# 登录态 JWT 配置。密钥只通过环境变量注入，禁止写入源码仓库。
# 当前为骨干阶段：JwtTokenService 尚未真正签发/校验，这些值只是预留契约。
security.auth.jwt.secret=${JWT_SECRET:change-me-in-local-or-env-not-for-production}
security.auth.jwt.issuer=${JWT_ISSUER:rag-agent}
# Access Token 有效期（秒）。第一阶段不实现 Refresh Token，因此保持较短。
security.auth.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:1800}
# HttpOnly Cookie 名称；浏览器会自动携带，前端 JS 不应读取其内容。
security.auth.cookie.name=${AUTH_COOKIE_NAME:access_token}
security.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
security.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
security.auth.cookie.path=${AUTH_COOKIE_PATH:/}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000
app.rate-limit.register-per-ip-per-minute=${RATE_LIMIT_REGISTER:10}
app.rate-limit.login-per-ip-per-minute=${RATE_LIMIT_LOGIN_IP:10}
app.rate-limit.login-per-account-per-minute=${RATE_LIMIT_LOGIN_ACCOUNT:5}
app.rate-limit.send-per-user-per-minute=${RATE_LIMIT_SEND:20}
# 仅当部署在可信反向代理之后才开启：信任 X-Forwarded-For 作为客户端 IP。
# 默认关闭，防止伪造请求头绕过 IP 限流。
app.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_XFF:false}
app.auth.lock-threshold=${AUTH_LOCK_THRESHOLD:5}
app.auth.lock-duration-minutes=${AUTH_LOCK_MINUTES:15}
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
