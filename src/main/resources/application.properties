spring.application.name=rag_agent
# 本机密码等私有配置放在被 Git 忽略的 .local/application.properties 中。
spring.config.import=optional:file:./.local/application.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rag_agent}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
# 登录态 JWT 配置。密钥只通过环境变量注入，禁止写入源码仓库。
# 当前为骨干阶段：JwtTokenService 尚未真正签发/校验，这些值只是预留契约。
security.auth.jwt.secret=${JWT_SECRET:change-me-in-local-or-env-not-for-production}
security.auth.jwt.issuer=${JWT_ISSUER:rag-agent}
# Access Token 有效期（秒）。第一阶段不实现 Refresh Token，因此保持较短。
security.auth.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:1800}
# HttpOnly Cookie 名称；浏览器会自动携带，前端 JS 不应读取其内容。
security.auth.cookie.name=${AUTH_COOKIE_NAME:access_token}
security.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
security.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
security.auth.cookie.path=${AUTH_COOKIE_PATH:/}
